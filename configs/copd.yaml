# CoPD training configuration.
data:
  text_train_files: ''
  text_val_files: ''
  vision_train_files: ''
  vision_val_files: ''
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  max_prompt_length: 16384
  max_response_length: 16384
  rollout_batch_size: 256
  val_batch_size: 512
  format_prompt: prompts/unified.jinja
  shuffle: true
  seed: 42
  min_pixels: 262144
  max_pixels: 262144
  image_max_pixels: 1048576
  video_max_pixels: 262144
  filter_overlong_prompts: false
algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
worker:
  actor:
    global_batch_size: 64
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    max_token_len_per_gpu: 32768
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen3-VL-4B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false
      offload_optimizer: false
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    limit_images: 5
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    max_num_batched_tokens: 32768
    disable_tqdm: true
    val_override_config:
      temperature: 0.7
      top_p: 0.95
      n: 1
  reward:
    reward_function: rewards/unified.py:compute_score
    reward_function_kwargs:
      thinking_tag: thought
trainer:
  total_epochs: 10
  project_name: CoPD
  experiment_name: text_image_4b_bk0.01
  logger:
  - console
  - wandb
  - file
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 5
  val_before_train: true
  val_only: false
  val_generations_to_log: 1
  save_freq: 20
  save_limit: 20
  save_model_only: false
  save_checkpoint_path: outputs/text_image_4b_bk0.01
  load_checkpoint_path: null
  find_last_checkpoint: true
  max_steps: null
parallel:
  enabled: true
  rollout_batch_size_a: 256
  actor_global_batch_size_a: 256
  rollout_batch_size_b: 256
  actor_global_batch_size_b: 128
  n_gpus_per_model: 4
  rollout_seed_a: 1
  rollout_seed_b: 2
  rollout_temperature_a: 1.0
  rollout_temperature_b: 1.0
  rollout_top_p_a: 1.0
  rollout_top_p_b: 1.0
  model_path_a: null
  model_path_b: null
  sequential_first_a: false
coev:
  enabled: true
  hub_branch: text
  wandb_branch_name_text: branch_text
  wandb_branch_name_vision: branch_vision
  mode: cross_reward
  anchor_coef: 0.01
  foreign_grpo_loss_enabled: false
  cross_reward_loss_enabled: true
  cross_reward_style: reverse_kl
  # Distillation coefficients.
  reverse_kl_coef: 0.01
  reverse_kl_coef_text: 0.01
  reverse_kl_coef_vision: 0.01
  opd_adaptive_coef: true
  opd_off_steps: 50
  opd_on_steps: 30
